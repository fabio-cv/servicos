spring.application.name=servidorlocal

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/servidorlocal}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

server.max-http-header-size=128KB
server.tomcat.max-http-form-post-size=2MB

# Configurações do servidor de Email (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=***EMAIL_REMOVED***
spring.mail.password=***PASSWORD_REMOVED***

# Configurações avançadas de segurança exigida pelo Gmail
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
